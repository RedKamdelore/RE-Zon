appId: com.playerdxd.app
productName: Player_DXD
directories:
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/demo
    to: demo
  - from: resources/icon.png
    to: icon.png
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Player_DXD
